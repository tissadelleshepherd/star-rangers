# Sample deploy.conf - copy this to a real "deploy.conf" in the repository
# root of a cPanel Git Version Control clone, then edit the values for that
# clone's domain. "deploy.conf" itself is untracked (gitignored) since each
# clone's settings are specific to that domain/account - this sample file is
# the only copy tracked in git. See .cpanel.yml's header comment and the
# "cPanel deployment config for local clones" section of TECHNICAL-README.md for full
# details on each key.
#
#   cp sample-deploy.conf deploy.conf
#
# Every key below is optional; commenting one out (or deleting deploy.conf
# entirely) falls back to the default shown in its comment.
#
# ---------------------------------------------------------------------------
# A MINIMUM VIABLE deploy.conf IS NOW TWO LINES (since 2026-07-30)
# ---------------------------------------------------------------------------
#
#   CPANEL_USER=...
#   DOMAIN=...
#
# and sample-deploy-minimal.conf is exactly that file, ready to copy:
#
#   cp sample-deploy-minimal.conf deploy.conf
#
# plus ALT_DOMAINS if this account serves more than one domain. Everything a
# domain's IDENTITY consists of now lives in the repo, in lib/editions.js, keyed
# by domain: THEME, EDITION, CHARACTERS, TOPICS, THREADS, SITE_NAME, SITE_TITLE,
# COMMENTS_ENABLED and GISCUS_PROFILE are each filled in from there when this
# file leaves them unset. scripts/resolve-edition.js does the lookup and
# scripts/cpanel-deploy.sh applies it.
#
# **This file still wins wherever it sets a value** - the registry only fills
# gaps, so nothing here changes behaviour for an existing clone. The deploy log
# prints one line per resolved key saying whether it came from deploy.conf or
# from the edition, so you can see exactly what was inferred.
#
# WHY THE SPLIT FALLS WHERE IT DOES. What stays here is what only this machine
# knows or should hold: the account name, which domains it serves, where to mail
# the deploy log, the raw giscus ids, and a clone-local CSS file. What moved is
# everything that is a DECISION about a domain - reviewable in a pull request,
# versioned, and impossible to misconfigure silently on a server. That matters
# most for the reading tier: which tier a domain sits at decides whether the
# contemplative church-space thread exists on it, and that is not a key here
# at all - it rides in with EDITION, from the registry, where it can be read
# and reviewed.
#
# Note GISCUS_PROFILE and the raw GISCUS_*_ID keys land on opposite sides, and
# that is the seam for independent hosting: a profile name means nothing outside
# this repo's registry, whereas the raw ids are exactly what someone hosting
# their own copy supplies. They do that via giscus.local.json, and register
# their domain via editions.local.json - both untracked, both with a tracked
# sample - so hosting this site elsewhere never requires a fork.

# Destination cPanel account: deploys to /home/<CPANEL_USER>/public_html/.
# Default: sciencef
CPANEL_USER=sciencef

# CSS theme. "default" uses src/css/main.css as-is; any other value maps to
# src/css/theme-<THEME>.css, falling back to main.css if that file doesn't
# exist in the repo. Every theme below is generated from main.css by
# scripts/generate-themes.js (`npm run generate-themes`), which swaps in
# only that theme's palette and keeps everything else byte-for-byte in
# sync with main.css - see that script's THEMES registry to add a new one
# or tweak an existing palette.
#
# Domain re-skins (tied to a specific production domain's branding):
#   fellowship    - warm, luminous gold/parchment palette (fellowshipoflight.org)
#   pets          - warm, friendly orange/cream palette (undercover-pets.com)
#   starquest     - deep-space navy with neon teal accents (starquest.site/.online)
#
# Standard themes (general-purpose, not tied to any domain):
#   light         - light/day mode; the site's only non-dark option
#   high-contrast - maximal-contrast black/white/yellow, for low-vision accessibility
#   sepia         - warm parchment/e-reader tone for long reading sessions
#   solarized     - Ethan Schoonover's Solarized Dark palette
#
# Resolved from lib/editions.js by DOMAIN when left unset - so for a registered
# domain you can delete this line entirely. Setting it here still wins.
# Default: (unset - the edition's theme, or "default" if the domain isn't
# registered)
#THEME=default

# Which entry in lib/editions.js supplies this domain's copy and flourishes -
# the tagline, hero cast, footer audio. Normally left unset and resolved from
# DOMAIN; set it to take an edition that isn't the one registered for this
# domain, or to preview a branded edition from an unregistered host.
#
# Deliberately INDEPENDENT of THEME. THEME is a palette and several domains
# share one; EDITION is identity. lib/editions.js still falls back to THEME when
# EDITION is unset, which is what keeps a pre-registry deploy.conf working, but
# the two are separate axes now: EDITION=folspace THEME=fellowship is a sentence
# you can write.
# Default: (unset - resolved from DOMAIN)
#EDITION=folspace

# THERE IS NO PRESENTATION KEY, and its absence is a decision rather than an
# omission. A presentation mode - how a domain wants to be READ, as against who
# it is (EDITION) or what colour it is (THEME) - is set per edition in
# lib/editions.js and nowhere else. Two reasons. It needs no plumbing: EDITION
# is already exported into the Eleventy build, which writes the mode onto <html>
# itself, where THEME is here only because the deploy copies a stylesheet over
# main.css. And a posture is an identity decision, so it belongs in a tracked,
# reviewed registry rather than in an untracked file on one server - the same
# reasoning that moved THEME, THREADS and SITE_NAME here in the first place.
# See TECHNICAL-README.md's "Presentation modes" section.

# Public domain this clone serves - no scheme, no path, no trailing slash
# (e.g. "undercover-pets.com"). Used to build the absolute URLs that
# robots.txt's Sitemap line and every <loc> in sitemap.xml need; both are
# generated at build time (src/robots.njk, src/sitemap.njk, driven by
# src/_data/site.js) rather than copied as static files, specifically so
# each cPanel clone gets its own correct domain instead of all of them
# sharing one hardcoded host.
# REQUIRED since 2026-10-09: there is no default, and the deploy refuses to
# run without it. Two clones whose deploy.conf lacked this line fell back to
# the canonical domain and served the canonical site under their own names
# (sciencefiction.site and starquest.site, found in a Search Console sweep).
DOMAIN=fianilchruinne.com

# Brand name shown in the header logo, footer, and homepage heading of the
# deployed site.
# Default: Fian Ilchruinne
#SITE_NAME=Fian Ilchruinne

# Text used in every page's browser <title> tag (as the "| <SITE_TITLE>"
# suffix, or standalone on the home page). Kept separate from SITE_NAME so
# a clone can use a different string in the tab title than in its on-page
# branding, if desired - most clones will just want the same value in both.
# Default: Fian-ilchruinne
#SITE_TITLE=Fian-ilchruinne

# Set true to build this domain as a NON-INDEXED testing/staging site:
# robots.txt becomes "Disallow: /", every page carries a noindex,nofollow
# robots meta, and no canonical links are emitted - so a test (sub)domain
# serving the full site can't compete with the canonical domain in search.
# The recipe for a throwaway testing subdomain is exactly three keys beyond
# the account: DOMAIN=<test subdomain>, SITE_NOINDEX=true,
# COMMENTS_ENABLED=false (so test pages never attach pathname-mapped
# discussions to the shared board), plus an ADMIN_EMAIL that really exists.
# Deliberately deploy.conf-only - a testing domain is exactly the kind that
# should NOT be registered in lib/editions.js.
# Default: false
#SITE_NOINDEX=true

# Comma-separated, case-insensitive character id list. When set, narrows
# the deployed site to content related to these characters (character page
# `id`, chapter `povs[].id`, and tag matches). Leave blank/commented for the
# full, unfiltered site.
# Default: (unset - full site)
#CHARACTERS=aldera,elvira

# Comma-separated, case-insensitive topic list. When set, narrows the
# deployed site to content whose `tags`/`category` match. Leave
# blank/commented for the full, unfiltered site.
# Default: (unset - full site)
#TOPICS=boundary,detective-agency

# Comma-separated, case-insensitive storyline thread id list (see
# src/threads/ and lib/storyline-threads.js for the registry - currently
# "founding-era", "tissadelle-arc", and "church-space"). When set, narrows
# the deployed site to every season that thread covers (all of that season's
# chapters, plus any lore/timeline/glossary/codex entry explicitly tagged
# with the thread id). Combines with CHARACTERS/TOPICS rather than replacing
# them - a page matching any one of the three is included. Leave
# blank/commented for the full, unfiltered site.
#
# "church-space" is gated to the CONTEMPLATIVE reading tier (`tier` in
# lib/storyline-threads.js, since 2026-09-04; `private: true` before that):
# it is absent on every build whose edition sits below that tier - the full
# unfiltered site included - and naming it here does NOT open it. On a
# contemplative-tier edition it narrows like any other thread. The
# church-space example block at the bottom of this file sets
# THREADS=church-space as ordinary narrowing on a domain that is at that tier.
# Default: (unset - full site)
#THREADS=tissadelle-arc

# Address to email the full deployment log to after every deploy attempt
# (success or failure). Best-effort only - never blocks the deploy itself.
# If left unset/commented, defaults to admin@<DOMAIN> (using this file's
# DOMAIN setting above), rather than hardcoding a real address in this
# public repo.
#
# Since 2026-08-13 scripts/cpanel-autopull.sh uses this address too, for the
# failures that happen BEFORE any deploy starts (a broken checkout, or a pull
# that cannot fast-forward). Those used to go only to stderr, which cron
# delivers to the account's own system mailbox where nobody reads it - so a
# failed run and a run with nothing to do looked identical from a mailbox.
# Default: admin@<DOMAIN>
#ADMIN_EMAIL=admin@example.com

# Optional (since 2026-09-14). Which deploy outcomes ADMIN_EMAIL is mailed
# about. Failures are always mailed; this only decides what a SUCCESSFUL run
# does:
#   always    mail every attempt (the default, and the behaviour before this
#             key existed)
#   warnings  mail a success only when its log carries a warning from the
#             deploy scripts themselves - a domain with no identity in
#             lib/editions.js, a defaulted ADMIN_EMAIL - with the subject
#             reading SUCCESS WITH WARNINGS; a clean success is not mailed
#   failure   never mail a success
# Before switching off routine success mail, note what it was quietly doing:
# it was the one regular proof that ADMIN_EMAIL actually delivers (a
# nonexistent admin@ address is accepted by the MTA and silently discarded),
# and after a merge the check that a domain shipped is /version.txt, not the
# absence of mail. An unrecognised value is treated as "always".
# Default: always
#NOTIFY_ON=warnings

# Optional. If set, cpanel-autopull.sh mails a "runs were missed" alert when
# it finds the previous run longer ago than this many hours. Leave unset (the
# default) for no gap alerting.
#
# Deliberately not defaulted to a number: the cron interval is configured in
# cPanel -> Cron Jobs, not in this repo, so only the account holder knows what
# a suspicious gap looks like. Set it comfortably above the real interval - on
# a ten-minute cron, 2 catches a stalled schedule; on a daily overnight one, 36
# catches a missed night without crying wolf over a run that merely drifted.
#
# It can only report on the next run that actually happens. A cron that stops
# firing entirely cannot report its own absence.
# Default: (unset - no gap alerting)
#AUTOPULL_MAX_GAP_HOURS=2

# *** DEPRECATED 2026-07-30 - do not use for new clones. ***
#
# Still honoured so no live domain loses a page overnight, but the deploy now
# logs a warning, and it will be removed. Two reasons, the second binding:
#
#   1. It keeps story prose OUTSIDE the repo: unversioned, unreviewable, not
#      seen by `npm test`, check-internal-links.js or check-related-terms.js,
#      outside the CC BY-NC-ND scope CONTENT-LICENSE.md describes, and lost
#      with the hosting account.
#   2. It writes into src/lore/, and lore is CANON. **Canon is centralised,
#      and per-domain variants must be non-canonical** (settled 2026-07-30).
#      This is the only key in the system that could make two domains
#      disagree about a fact instead of merely showing different subsets of
#      one record - CHARACTERS/TOPICS/THREADS only ever subtract, never
#      contradict. Removing it closes the last route to per-domain canon.
#
# Replacement: lib/editions.js, a tracked registry of per-domain copy and
# flourishes selected by EDITION (falling back to THEME). In-repo, versioned,
# reviewable, and non-canonical by construction - it carries framing, not
# facts. CUSTOM_CSS_FILE below is NOT deprecated - but see the correction in
# its own comment: it cannot change the record, which is a narrower claim than
# "it is cosmetic".
#
# Path to a clone-local, untracked markdown file with valid lore-entry
# front matter (layout: lore-entry.njk, title, category, tags,
# description - see any file under src/lore/ for the shape). If set and
# the file exists, it's copied into src/lore/custom/ before the build, so
# it becomes one extra lore page unique to this clone (builds at
# /lore/custom/<filename-without-extension>/), then removed again once the
# build has read it - never committed to the shared repo. Fails the deploy
# if set but the file can't be found, rather than silently skipping it.
# Default: (unset - no extra lore page)
#CUSTOM_LORE_FILE=/home/undercov/custom-lore/undercover-pets-origin.md

# Path to a clone-local, untracked CSS file. If set and the file exists,
# its contents are appended to the deployed css/main.css after the THEME
# stylesheet, so small clone-specific style tweaks (a color, a font swap)
# don't need a whole new theme-<name>.css living in the shared repo - and
# since it loads last, its rules can override the theme's. Fails the
# deploy if set but the file can't be found, rather than silently skipping
# it.
#
# CORRECTION (2026-07-30): an earlier version of this file called this key
# "cosmetic" and said it "cannot assert a fact". That was wrong, and the
# accurate statement is narrower - it cannot change the RECORD. CSS here is more
# powerful than a colour tweak, in four ways, worst first:
#
#   1. It can INJECT TEXT. `content:` on ::before/::after puts arbitrary prose
#      on a page, which is an assertion delivered by stylesheet. No CSP
#      restrains it, and this file is appended LAST so it overrides everything.
#   2. It can HIDE content: display:none on .codex-entry__status suppresses the
#      "not canon, cite it as an account" notice on every codex entry; on
#      .canon-facts it hides a chapter's canon facts; on .site-footer it hides
#      the CC BY-NC-ND attribution.
#   3. It can REORDER visually (flex `order`, grid placement) so a human reads
#      one sequence while the DOM says another.
#   4. It can reach EXTERNAL HOSTS via @import, url() and @font-face.
#
# What limits all four is that they affect RENDERING only. The DOM is untouched,
# so every reader that does not execute CSS still gets the real thing: crawlers,
# chatbots, screen readers, reader mode, view-source, the Atom feed, llms.txt.
# So the canon rule holds structurally - nothing CSS does enters the record -
# and leaks perceptually, because a human viewing that one domain cannot tell.
# It cuts both ways: `content:`-injected text is invisible to search engines and
# to an LLM fetching the page, so an injected "fact" is a fact for a sighted
# human on one domain and nobody else.
#
# The deploy WARNS (it does not fail) when it spots these constructs - see
# check_custom_css_powers() in scripts/cpanel-deploy.sh. Warning rather than
# failing because `content: ""` is ordinary pseudo-element decoration and a
# false positive that blocks a deploy is worse than a line in the log. The
# realistic risk is not sabotage, it is forgetting: hiding that notice months
# from now while tidying a box you no longer recognise.
# Default: (unset - no extra CSS)
#CUSTOM_CSS_FILE=/home/undercov/custom-lore/undercover-pets-tweaks.css

# Set to false to build this clone with the giscus comment widget turned
# off entirely (see TECHNICAL-README.md's "Discussion forum (giscus)" section) - e.g.
# a staging/preview domain that shouldn't collect public comments.
# Default: true
#COMMENTS_ENABLED=true

# GISCUS_PROFILE selects one of the project's OWN registered comment repos
# (GISCUS_PROFILES in src/_data/giscus.js) as THIS BUILD's board, with a
# single key instead of pasting all six IDs below. Registered profiles:
#   default       - Star-Rangers/sciencefiction-site-comments (the shared
#                   pool: every one of the project's own domains)
#   church-space  - Star-Rangers/churchspace-site-comments (the Communion's
#                   board)
# LEAVE IT UNSET on every one of the project's own domains, the contemplative
# ones included (Dermot's ruling, 2026-09-04: the board is picked per PAGE).
# The church-space thread names the Communion's board itself in
# lib/storyline-threads.js, so its pages post there on any domain, and every
# other page - the main sequence on fellowshipoflight.org, say - posts to the
# shared pool. Setting GISCUS_PROFILE=church-space here would make the WHOLE
# build post to the Communion's board again, splitting a shared chapter's
# conversation in two; deploy.conf wins over the registry wherever it sets a
# value, so a stale line here silently undoes the ruling. An unknown name
# fails the build loudly (typo guard) rather than silently using the default
# board.
# Default: default
#GISCUS_PROFILE=default

# GISCUS_REPO / GISCUS_REPO_ID / GISCUS_CATEGORY_{CHARACTERS,LORE,EPISODES,JOURNAL}_ID
# are the escape hatch for a THIRD-PARTY FORK pointing at ITS OWN comments repo
# - one that isn't a registered GISCUS_PROFILE above. Each key overrides just
# the matching field of the selected profile, so a fork can either set all six
# for a wholly separate repo, or start from a profile and change only what
# differs. Leave all six unset/commented to use whatever GISCUS_PROFILE picked
# (or the shared default). Get the IDs the same way as the default repo (see
# TECHNICAL-README.md's "Discussion forum (giscus)" one-time setup): create the repo,
# enable Discussions, create the same 9 categories, install the giscus app,
# then run `GITHUB_TOKEN=ghp_xxx node scripts/fetch-giscus-ids.js --repo
# owner/name` and paste the five values it prints below.
# Default: (unset - use GISCUS_PROFILE, else the shared default repo)
#GISCUS_REPO=your-org/your-comments-repo
#GISCUS_REPO_ID=REPLACE_WITH_REPO_ID
#GISCUS_CATEGORY_CHARACTERS_ID=REPLACE_WITH_CATEGORY_ID
#GISCUS_CATEGORY_LORE_ID=REPLACE_WITH_CATEGORY_ID
#GISCUS_CATEGORY_EPISODES_ID=REPLACE_WITH_CATEGORY_ID
#GISCUS_CATEGORY_JOURNAL_ID=REPLACE_WITH_CATEGORY_ID

# Set to false to skip deploying to /home/<CPANEL_USER>/public_html/
# entirely - for a cPanel account whose public_html is reserved for
# something else (or deliberately left parked) and that should only serve
# one or more addon domains via ALT_DOMAINS below. Deploying with
# DEPLOY_PRIMARY=false and ALT_DOMAINS left unset/empty fails loudly rather
# than silently doing nothing, since that combination has no domain left
# to deploy to.
# Default: true
#DEPLOY_PRIMARY=true

# ---------------------------------------------------------------------------
# Alt domains: deploy additional domains from THIS SAME clone/checkout,
# alongside the primary domain above, instead of needing a separate cPanel
# Git Version Control clone per domain. Each alt domain is a sibling folder
# under this account's $HOME, at the same level as public_html/ (typically
# an addon domain's own document root) - create that folder / point the
# addon domain at it in cPanel first, then list it here.
#
# ALT_DOMAINS is a space-separated list of short ids (letters/digits/
# underscore only, can't start with a digit - these become variable name
# suffixes, not folder names). Every id listed needs its own ALT_<id>_DIR
# and ALT_<id>_DOMAIN below - both required, since (unlike everything
# else) there's no safe default folder or public domain to guess. Every
# other ALT_<id>_* key is optional and defaults exactly the way its
# unprefixed counterpart above does. Leave ALT_DOMAINS unset/commented for
# today's single-domain behavior - nothing here changes unless it's set.
#
# A listed alt domain whose ALT_<id>_DIR folder doesn't exist, or that's
# missing ALT_<id>_DIR/ALT_<id>_DOMAIN, or whose id isn't a valid
# identifier, FAILS that domain loudly (a clear FAIL line + a non-zero
# deploy exit + a notification) rather than silently skipping it - same
# philosophy as CUSTOM_LORE_FILE/CUSTOM_CSS_FILE above. One alt domain
# failing does NOT stop the primary domain, or any other alt domain, from
# still deploying - see scripts/cpanel-deploy.sh's build_and_deploy() for
# details.
#
# Every id below is a placeholder - rename each one (and its ALT_<id>_*
# keys) to whatever's meaningful for the domains actually being added, and
# delete any of the four you don't need. Nothing about the mechanism caps
# the count at four; that's just how many this particular clone happens to
# be adding today.
#
# If this account's public_html shouldn't get a copy of the site at all -
# only the addon domain(s) listed here - set DEPLOY_PRIMARY=false above.
# Default: (unset - primary domain only)
#ALT_DOMAINS="altsite1 altsite2 altsite3 altsite4"

# --- altsite1: deploys to /home/sciencef/altsite1_html/ --------------------
#ALT_altsite1_DIR=altsite1_html
#ALT_altsite1_DOMAIN=altsite1.example
#ALT_altsite1_THEME=default
#ALT_altsite1_SITE_NAME=Alt Site One
#ALT_altsite1_SITE_TITLE=Alt Site One
#ALT_altsite1_CHARACTERS=aldera,elvira
#ALT_altsite1_TOPICS=boundary,detective-agency
#ALT_altsite1_THREADS=tissadelle-arc
#ALT_altsite1_ADMIN_EMAIL=admin@altsite1.example
#ALT_altsite1_CUSTOM_LORE_FILE=/home/sciencef/custom-lore/altsite1-origin.md
#ALT_altsite1_CUSTOM_CSS_FILE=/home/sciencef/custom-lore/altsite1-tweaks.css
#ALT_altsite1_COMMENTS_ENABLED=true
#ALT_altsite1_GISCUS_REPO=Star-Rangers/altsite1-site-comments
#ALT_altsite1_GISCUS_REPO_ID=REPLACE_WITH_REPO_ID
#ALT_altsite1_GISCUS_CATEGORY_CHARACTERS_ID=REPLACE_WITH_CATEGORY_ID
#ALT_altsite1_GISCUS_CATEGORY_LORE_ID=REPLACE_WITH_CATEGORY_ID
#ALT_altsite1_GISCUS_CATEGORY_EPISODES_ID=REPLACE_WITH_CATEGORY_ID
#ALT_altsite1_GISCUS_CATEGORY_JOURNAL_ID=REPLACE_WITH_CATEGORY_ID

# --- altsite2: deploys to /home/sciencef/altsite2_html/ --------------------
#ALT_altsite2_DIR=altsite2_html
#ALT_altsite2_DOMAIN=altsite2.example
#ALT_altsite2_THEME=default

# --- altsite3: deploys to /home/sciencef/altsite3_html/ --------------------
#ALT_altsite3_DIR=altsite3_html
#ALT_altsite3_DOMAIN=altsite3.example
#ALT_altsite3_THEME=default

# --- altsite4: deploys to /home/sciencef/altsite4_html/ --------------------
#ALT_altsite4_DIR=altsite4_html
#ALT_altsite4_DOMAIN=altsite4.example
#ALT_altsite4_THEME=default

# --- church-space example: a real, non-placeholder pairing -----------------
# church-space.site and church-space.online serve the SAME content from two
# addon domains (create both in cPanel, pointing at these two sibling
# folders, before adding them here). Since 2026-09-03 the registry supplies
# the CONTEMPLATIVE tier's full filter for these domains (every public thread
# plus church-space), and since 2026-09-04 the board is picked per page - the
# church-space thread posts to the Communion's board by itself. So the values
# below are the two-key minimum plus branding: NO THREADS line, which would
# narrow the domain back to the one thread and undo the tier ladder, and NO
# GISCUS_PROFILE line, which would put the whole build on the Communion's
# board and split every shared chapter's conversation. deploy.conf wins over
# the registry wherever it sets a value; the deploy log prints which won.
#ALT_churchspacesite_DIR=churchspace_site_html
#ALT_churchspacesite_DOMAIN=church-space.site
#ALT_churchspacesite_SITE_NAME=Church Space
#ALT_churchspacesite_SITE_TITLE=Church Space
#ALT_churchspacesite_THEME=church-space

#ALT_churchspaceonline_DIR=churchspace_online_html
#ALT_churchspaceonline_DOMAIN=church-space.online
#ALT_churchspaceonline_SITE_NAME=Church Space
#ALT_churchspaceonline_SITE_TITLE=Church Space
#ALT_churchspaceonline_THEME=church-space

# --- Fellowship of Light: church-space's addon domains ---------------------
# fellowshipoflight.site/.org/.online/.space are addon domains on the SAME
# church-space cPanel account, each a sibling folder alongside public_html/.
# They use the "fellowship" theme (warm gold/parchment) but otherwise deploy
# like church-space, and the same two rules apply: no THREADS line (the
# registry supplies the contemplative tier's full filter) and no
# GISCUS_PROFILE line (the board is picked per page; the Communion's rides on
# the church-space thread). Sample/reference values - set the real
# ALT_<id>_DIR folders (and confirm the .online spelling) before enabling.
# Listed here per the four ids in ALT_DOMAINS above; add them there to
# actually deploy.
#ALT_folsite_DIR=fellowshipoflight_site_html
#ALT_folsite_DOMAIN=fellowshipoflight.site
#ALT_folsite_SITE_NAME=Fellowship of Light
#ALT_folsite_SITE_TITLE=Fellowship of Light
#ALT_folsite_THEME=fellowship

#ALT_folorg_DIR=fellowshipoflight_org_html
#ALT_folorg_DOMAIN=fellowshipoflight.org
#ALT_folorg_SITE_NAME=Fellowship of Light
#ALT_folorg_SITE_TITLE=Fellowship of Light
#ALT_folorg_THEME=fellowship

#ALT_folonline_DIR=fellowshipoflight_online_html
#ALT_folonline_DOMAIN=fellowshipoflight.online
#ALT_folonline_SITE_NAME=Fellowship of Light
#ALT_folonline_SITE_TITLE=Fellowship of Light
#ALT_folonline_THEME=fellowship

#ALT_folspace_DIR=fellowshipoflight_space_html
#ALT_folspace_DOMAIN=fellowshipoflight.space
#ALT_folspace_SITE_NAME=Fellowship of Light
#ALT_folspace_SITE_TITLE=Fellowship of Light
#ALT_folspace_THEME=fellowship
