name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (Eleventy dry run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags. scripts/check-changelog.js uses git tags as
          # its oracle for which releases must still have a CHANGELOG section,
          # and the default shallow checkout fetches none - so the check would
          # degrade to structure-only here, silently, in the one place that
          # gates every device. A tablet cannot run npm test; CI is what
          # actually enforces this.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Contrast has to run AFTER generate-themes because it reads the
      # generated theme-*.css files - which is exactly why it stays out of
      # npm test (a check that fails because you have not run another script
      # is a check people learn to ignore). CI can guarantee the ordering, so
      # here it is a real gate. The git diff in between catches a hand-edited
      # theme-*.css: main.css is the source of truth and regeneration must be
      # a no-op on a clean tree.
      - name: Theme sync and contrast
        run: |
          npm run generate-themes
          git diff --exit-code src/css
          node scripts/check-contrast.js

  shared-scripts:
    name: Shared deploy scripts match dermot-cochran-photography
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # deploy-lib.sh, mail-lib.sh, ensure-node.sh and cpanel-autopull.sh are
      # byte-identical shared files with dermot-cochran-photography (see
      # CLAUDE.md's "Before committing") - until this job, only discipline
      # enforced that, and cpanel-autopull.sh drifted for four days in August
      # 2026 before anyone noticed. Two outcomes:
      #   - a shared script differs from the sibling's main and this PR does
      #     NOT touch it -> pre-existing drift, fail;
      #   - this PR is the one changing it -> warn only, since the identical
      #     edit lands in the sibling as its own PR and one of the two has to
      #     go first.
      - name: Compare shared scripts against sibling main
        run: |
          sibling="dermot-r-cochran/dermot-cochran-photography"
          status=0
          for f in deploy-lib.sh mail-lib.sh ensure-node.sh cpanel-autopull.sh; do
            if ! curl -fsSL "https://raw.githubusercontent.com/${sibling}/main/scripts/${f}" -o "/tmp/sibling-${f}"; then
              echo "::warning file=scripts/${f}::could not fetch ${sibling} copy - skipping comparison"
              continue
            fi
            if diff -q "scripts/${f}" "/tmp/sibling-${f}" >/dev/null; then
              continue
            fi
            if git diff --quiet "origin/${GITHUB_BASE_REF}" -- "scripts/${f}"; then
              echo "::error file=scripts/${f}::differs from ${sibling} main and this PR does not change it - pre-existing drift; land the identical file in whichever repo is behind"
              status=1
            else
              echo "::warning file=scripts/${f}::this PR changes a shared script - the identical edit must land in ${sibling} in the same piece of work"
            fi
          done
          exit "${status}"

  shellcheck:
    name: ShellCheck deploy scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck --severity=warning scripts/cpanel-deploy.sh scripts/deploy-lib.sh scripts/mail-lib.sh scripts/ensure-node.sh scripts/cpanel-autopull.sh
