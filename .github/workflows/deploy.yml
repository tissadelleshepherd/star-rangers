name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags, so `git describe` below can name the
          # release the way scripts/deploy-lib.sh does for the cPanel clones.
          # The default shallow clone has no tags and would stamp the site
          # with the bare commit.
          fetch-depth: 0

      # Stamp what this run ships into /version.txt and <meta name="site-version">,
      # the same `git describe --tags --always` the cPanel deploy uses, so the
      # canonical domain can be checked from outside with one request like any
      # other domain (src/_data/build.js reads DEPLOY_VERSION). Before this the
      # Pages build reported "dev", which src/version.njk reserved for builds
      # that did not come through a deploy path - true of a local build, and no
      # longer true of this one.
      - name: Name the release being shipped
        run: echo "DEPLOY_VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build with Eleventy
        # Since 2026-10-06 this build is the canonical site itself:
        # fianilchruinne.com is the Pages custom domain (src/CNAME), served at
        # the root exactly as the cPanel clones serve their domains. So the
        # /star-rangers/ prefix is rewritten to / at build time (the same
        # rewrite scripts/cpanel-deploy.sh does with sed), the sitemap,
        # robots.txt, feed and canonicals name fianilchruinne.com, and
        # comments stay ON - giscus maps threads by pathname, and root-served
        # pathnames here are the same ones the cPanel build of this domain
        # used, so the discussions are shared rather than duplicated. (The
        # old /star-rangers/-prefixed Pages build forced comments off for
        # exactly that reason: its pathnames matched nothing.)
        #
        # A fork sets the two repository variables (Settings -> Secrets and
        # variables -> Actions -> Variables) instead of editing this file -
        # see .eleventy.js and FORKING.md. Unset, they fall back to this
        # project's own domain.
        run: npm run build
        env:
          SITE_PATH_PREFIX: ${{ vars.SITE_PATH_PREFIX || '/' }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN || 'fianilchruinne.com' }}

      # IndexNow, step one of two (scripts/indexnow.js): compare this build's
      # sitemap pages with the manifest the live site is serving from the last
      # deploy, write the new manifest into _site/, and keep the changed URLs
      # for the indexnow job to send once this build is live. Only this
      # repository's own build pings; a fork's Pages site does not.
      - name: Prepare the IndexNow list
        if: github.repository == 'dermot-r-cochran/star-rangers'
        run: |
          host="${SITE_DOMAIN:-fianilchruinne.com}"
          node scripts/indexnow.js prepare --site _site --host "$host" \
            --previous "https://$host/indexnow-manifest.json" --out indexnow-pending.json
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN || 'fianilchruinne.com' }}

      - name: Keep the IndexNow list for after the deploy
        if: github.repository == 'dermot-r-cochran/star-rangers'
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-pending
          path: indexnow-pending.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # IndexNow, step two: the build is live now, so send the changed URLs.
  # A failure here never fails the deploy; the script exits 0 on any error.
  indexnow:
    if: github.repository == 'dermot-r-cochran/star-rangers'
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/indexnow.js
          sparse-checkout-cone-mode: false

      - name: Fetch the IndexNow list
        uses: actions/download-artifact@v4
        with:
          name: indexnow-pending
        continue-on-error: true

      - name: Submit to IndexNow
        run: node scripts/indexnow.js submit indexnow-pending.json
